name: Build nft FIB modules

on:
  workflow_dispatch:
concurrency:
  group: fib-${{ github.ref }}
  cancel-in-progress: true

env:
  KERNEL_REPO: https://github.com/cctv18/android_kernel_oneplus_mt6991.git
  KERNEL_BRANCH: oneplus/mt6991_v_15.0.2_ace5_ultra_6.6.89
  ARCH: arm64

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout this repo (FIB out-of-tree sources)
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential bc flex bison libssl-dev libelf-dev dwarves \
            clang lld llvm git python3 rsync cpio

      - name: Clone kernel tree (shallow)
        run: |
          git clone --depth=1 --single-branch -b "$KERNEL_BRANCH" "$KERNEL_REPO" kernel
          echo "kernel HEAD: $(git -C kernel rev-parse --short HEAD)"
          # free some space
          df -h

      - name: Kernel config + modules_prepare
        working-directory: kernel
        run: |
          set -e
          mkdir -p out

          # Prefer GKI-style / existing defconfigs if present
          if [ -f arch/arm64/configs/gki_defconfig ]; then
            DEFCONFIG=gki_defconfig
          elif [ -f arch/arm64/configs/defconfig ]; then
            DEFCONFIG=defconfig
          else
            # fallback: any *gki* defconfig
            DEFCONFIG=$(ls arch/arm64/configs/*gki* 2>/dev/null | head -1 | xargs -n1 basename)
          fi
          echo "Using DEFCONFIG=$DEFCONFIG"

          # LLVM=1 is typical for Android 6.6 GKI; fall back to gcc cross if needed
          make_k() { make ARCH=arm64 O=out LLVM=1 LLVM_IAS=1 "$@"; }

          if ! make_k "$DEFCONFIG"; then
            echo "LLVM defconfig failed, trying without LLVM_IAS"
            make ARCH=arm64 O=out LLVM=1 "$DEFCONFIG"
          fi

          # Enable nf_tables + FIB as modules (and minimal deps)
          CFG=out/.config
          scripts/config --file "$CFG" \
            --enable NF_TABLES \
            --enable NF_TABLES_INET \
            --enable NF_TABLES_IPV4 \
            --enable NF_TABLES_IPV6 \
            --module NFT_FIB \
            --module NFT_FIB_IPV4 \
            --module NFT_FIB_IPV6 \
            --module NFT_FIB_INET \
            --module NFT_FIB_NETDEV \
            --enable NETFILTER \
            --enable NETFILTER_ADVANCED \
            --enable IP_NF_IPTABLES \
            --enable IP6_NF_IPTABLES || true

          make_k olddefconfig
          make_k modules_prepare

          # Ensure localversion / vermagic is visible
          grep -E 'CONFIG_LOCALVERSION|CONFIG_MODVERSIONS' out/.config || true

      - name: Build in-tree FIB modules
        working-directory: kernel
        run: |
          set -e
          make_k() { make ARCH=arm64 O=out LLVM=1 LLVM_IAS=1 "$@"; }

          # Build only the FIB objects via their directories
          make_k M=net/netfilter modules
          make_k M=net/ipv4/netfilter modules
          make_k M=net/ipv6/netfilter modules

          echo "== produced ko (find) =="
          find out -name 'nft_fib*.ko' -o -name 'nft_fib.ko' | tee /tmp/fib_kos.txt
          # also search without out/ prefix for in-tree build paths
          find . -name 'nft_fib*.ko' | tee -a /tmp/fib_kos.txt

      - name: Collect artifacts
        run: |
          set -e
          mkdir -p dist
          # Prefer out-of-tree build location under O=out
          for n in nft_fib nft_fib_ipv4 nft_fib_ipv6 nft_fib_inet nft_fib_netdev; do
            f=$(find kernel -name "${n}.ko" 2>/dev/null | head -1)
            if [ -n "$f" ]; then
              cp -v "$f" "dist/${n}.ko"
            else
              echo "WARN: missing ${n}.ko"
            fi
          done
          ls -la dist/
          if [ ! -f dist/nft_fib.ko ]; then
            echo "FATAL: nft_fib.ko not built"
            # dump config related lines for debug
            grep -i FIB kernel/out/.config || true
            exit 1
          fi
          # record vermagic for the user
          if command -v modinfo >/dev/null; then
            modinfo dist/nft_fib.ko | tee dist/modinfo.txt || true
          fi
          strings dist/nft_fib.ko | grep -m1 vermagic= | tee dist/vermagic.txt || true

      - name: Upload .ko artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nft-fib-ko
          path: |
            dist/*.ko
            dist/*.txt
          if-no-files-found: error
          retention-days: 14
