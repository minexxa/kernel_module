name: Build nft FIB modules

on:
  workflow_dispatch:
  push:
    paths:
      - "src/**"
      - ".github/workflows/main.yml"

concurrency:
  group: fib-${{ github.ref }}
  cancel-in-progress: true

env:
  KERNEL_REPO: https://github.com/cctv18/android_kernel_oneplus_mt6991.git
  KERNEL_BRANCH: oneplus/mt6991_v_15.0.2_ace5_ultra_6.6.89
  ARCH: arm64

jobs:
  build:
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 300

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential bc flex bison libssl-dev libelf-dev dwarves \
            clang lld llvm git python3 rsync cpio pahole

      - name: Clone kernel tree (shallow)
        run: |
          git clone --depth=1 --single-branch -b "$KERNEL_BRANCH" "$KERNEL_REPO" kernel
          echo "kernel HEAD: $(git -C kernel rev-parse --short HEAD)"
          df -h

      - name: Kernel config
        working-directory: kernel
        run: |
          set -eux
          mkdir -p out

          if [ -f arch/arm64/configs/gki_defconfig ]; then
            DEFCONFIG=gki_defconfig
          elif [ -f arch/arm64/configs/defconfig ]; then
            DEFCONFIG=defconfig
          else
            DEFCONFIG=$(basename "$(ls arch/arm64/configs/*gki* 2>/dev/null | head -1)")
          fi
          echo "DEFCONFIG=$DEFCONFIG"

          make ARCH=arm64 O=out LLVM=1 LLVM_IAS=1 "$DEFCONFIG"

          CFG=out/.config
          # Core netfilter + nf_tables as MODULES so FIB can link against their exports
          scripts/config --file "$CFG" \
            --enable NETFILTER \
            --enable NETFILTER_ADVANCED \
            --enable NETFILTER_INGRESS \
            --enable NETFILTER_EGRESS \
            --enable NETFILTER_NETLINK \
            --enable NF_CONNTRACK \
            --enable NF_TABLES \
            --enable NF_TABLES_INET \
            --enable NF_TABLES_IPV4 \
            --enable NF_TABLES_IPV6 \
            --module NFT_FIB \
            --module NFT_FIB_IPV4 \
            --module NFT_FIB_IPV6 \
            --module NFT_FIB_INET \
            --module NFT_FIB_NETDEV

          # Keep nf_tables itself as module (=m) so Module.symvers gets its exports
          scripts/config --file "$CFG" --module NF_TABLES || true
          scripts/config --file "$CFG" --enable NF_TABLES || true

          # Faster CI: skip debug info bloat where possible
          scripts/config --file "$CFG" \
            --disable DEBUG_INFO \
            --disable DEBUG_INFO_BTF \
            --disable DEBUG_INFO_DWARF_TOOLCHAIN_DEFAULT \
            --set-val CONFIG_DEBUG_INFO_NONE y || true

          make ARCH=arm64 O=out LLVM=1 LLVM_IAS=1 olddefconfig

          echo "== relevant config =="
          grep -E 'CONFIG_NF_TABLES|CONFIG_NFT_FIB|CONFIG_MODVERSIONS|CONFIG_MODULES' out/.config | head -40

      - name: Build kernel + Module.symvers (required for modpost)
        working-directory: kernel
        run: |
          set -eux
          # modules_prepare alone is NOT enough — modpost needs a real Module.symvers
          # from a kernel/modules build (exports nla_put, nft_register_expr, ...).
          make ARCH=arm64 O=out LLVM=1 LLVM_IAS=1 -j"$(nproc)" modules_prepare

          # Build vmlinux to populate core symbol versions
          make ARCH=arm64 O=out LLVM=1 LLVM_IAS=1 -j"$(nproc)" vmlinux

          # Build netfilter stack so nf_tables exports land in Module.symvers
          make ARCH=arm64 O=out LLVM=1 LLVM_IAS=1 -j"$(nproc)" \
            net/netfilter/ \
            net/ipv4/netfilter/ \
            net/ipv6/netfilter/ \
            || true

          # Full modules pass for netfilter-related (ensures Module.symvers is complete)
          make ARCH=arm64 O=out LLVM=1 LLVM_IAS=1 -j"$(nproc)" modules

          test -f out/Module.symvers
          echo "Module.symvers lines: $(wc -l < out/Module.symvers)"
          grep -E 'nft_register_expr|nft_chain_validate' out/Module.symvers | head || true
          df -h

      - name: Collect FIB .ko
        run: |
          set -eux
          mkdir -p dist
          for n in nft_fib nft_fib_ipv4 nft_fib_ipv6 nft_fib_inet nft_fib_netdev; do
            f=$(find kernel/out kernel -name "${n}.ko" 2>/dev/null | head -1 || true)
            if [ -n "$f" ]; then
              cp -v "$f" "dist/${n}.ko"
            else
              echo "WARN: missing ${n}.ko"
            fi
          done
          ls -la dist/
          test -f dist/nft_fib.ko
          test -f dist/nft_fib_ipv4.ko
          test -f dist/nft_fib_ipv6.ko
          test -f dist/nft_fib_inet.ko

          strings dist/nft_fib.ko | grep -m1 'vermagic=' | tee dist/verm
